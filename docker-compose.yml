services:
    postgres:
        image: pgvector/pgvector:pg17
        container_name: docmind-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: docmind
            POSTGRES_PASSWORD: 123456
            POSTGRES_DB: docmind
        ports:
            - '5432:5432'
        volumes:
            - docmind_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U docmind -d docmind']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    docmind_postgres_data:
